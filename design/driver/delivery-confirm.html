<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدهام — تأكيد التسليم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 'arabic': ['IBM Plex Sans Arabic', 'sans-serif'] },
          colors: {
            primary: { 50:'#EFF6FF',100:'#DBEAFE',200:'#BFDBFE',300:'#93C5FD',400:'#60A5FA',500:'#3B82F6',600:'#2563EB',700:'#1D4ED8',800:'#1E40AF',900:'#1E3A8A' },
            amber: { 50:'#FFFBEB',100:'#FEF3C7',500:'#F59E0B',600:'#D97706',700:'#B45309' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    .mobile-frame { width:390px; min-height:844px; margin:0 auto; background:white; box-shadow:0 0 0 1px #E4E4E7,0 25px 50px rgba(0,0,0,0.15); border-radius:40px; overflow:hidden; position:relative; }
    .screen-content { height:844px; overflow-y:auto; overflow-x:hidden; padding-bottom:100px; }
    .screen-content::-webkit-scrollbar { display:none; }
    .signature-canvas { background: repeating-linear-gradient(0deg, transparent, transparent 24px, #f3f4f6 24px, #f3f4f6 25px); }
  </style>
</head>
<body class="bg-slate-200 min-h-screen p-8 flex items-center justify-center font-arabic">

  <div class="mobile-frame">
    <div class="screen-content">

      <!-- Status Bar -->
      <div class="bg-primary-900 px-5 pt-3 pb-2 flex items-center justify-between">
        <span class="text-white text-xs font-semibold">15:20</span>
        <div class="flex items-center gap-1">
          <i class="ti ti-wifi text-white text-xs"></i>
          <i class="ti ti-battery-3 text-white text-xs"></i>
        </div>
      </div>

      <!-- Header -->
      <div class="bg-primary-900 px-5 pb-5 pt-2">
        <div class="flex items-center gap-3">
          <button class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center" data-link="active-trip.html">
            <i class="ti ti-chevron-right text-white text-lg"></i>
          </button>
          <h1 class="text-white font-bold text-lg">تأكيد التسليم</h1>
        </div>
      </div>

      <div class="bg-gray-50 px-4 pt-4 space-y-4">

        <!-- Order Summary -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-xs text-gray-400 mb-0.5">رقم الطلب</p>
              <p class="font-mono font-bold text-gray-800 text-base">EDH-2026-0142</p>
            </div>
            <div class="text-left">
              <span class="bg-primary-100 text-primary-700 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1">
                <i class="ti ti-map-pin text-xs"></i>
                وصل
              </span>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-gray-50 flex items-center gap-2">
            <i class="ti ti-building-store text-primary-500 text-sm"></i>
            <div>
              <p class="text-sm font-semibold text-gray-800">شركة الفهد للتجارة</p>
              <p class="text-xs text-gray-500">جدة، المنطقة الصناعية</p>
            </div>
          </div>
        </div>

        <!-- Photo Proof -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
          <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2">
            <i class="ti ti-camera text-primary-600"></i>
            صورة إثبات التسليم
          </h3>

          <!-- Photo Placeholder -->
          <div class="border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50 flex flex-col items-center justify-center py-10 mb-3 cursor-pointer hover:bg-gray-100 transition-colors">
            <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mb-3">
              <i class="ti ti-camera text-gray-300 text-3xl"></i>
            </div>
            <p class="text-sm text-gray-400 font-medium">اضغط لالتقاط صورة</p>
            <p class="text-xs text-gray-300 mt-1">صورة البضاعة عند التسليم</p>
          </div>

          <button class="w-full border border-primary-200 bg-primary-50 hover:bg-primary-100 text-primary-700 font-semibold py-3 rounded-xl text-sm flex items-center justify-center gap-2 transition-colors">
            <i class="ti ti-camera text-sm"></i>
            التقاط صورة
          </button>
        </div>

        <!-- Recipient Signature -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
              <i class="ti ti-signature text-primary-600"></i>
              توقيع المستلم
            </h3>
            <button class="text-xs text-red-400 hover:text-red-600 font-medium flex items-center gap-1">
              <i class="ti ti-eraser text-xs"></i>
              مسح
            </button>
          </div>

          <!-- Signature Canvas -->
          <div class="signature-canvas border border-gray-200 rounded-2xl bg-gray-50 flex items-center justify-center" style="height:130px;">
            <div class="text-center">
              <i class="ti ti-writing text-gray-200 text-4xl mb-2"></i>
              <p class="text-gray-300 text-sm">ضع توقيعك هنا</p>
            </div>
          </div>
        </div>

        <!-- Recipient Name -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
          <h3 class="text-sm font-bold text-gray-800 mb-3">بيانات المستلم</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1.5">اسم المستلم</label>
              <input type="text" placeholder="أدخل اسم المستلم الكامل"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1.5">ملاحظات (اختياري)</label>
              <textarea rows="2" placeholder="أي ملاحظات عند التسليم..."
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 resize-none"></textarea>
            </div>
          </div>
        </div>

        <!-- Cold Chain Final Reading -->
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4">
          <div class="flex items-center gap-2 mb-2">
            <i class="ti ti-snowflake text-primary-600"></i>
            <span class="text-sm font-bold text-primary-800">قراءة الحرارة النهائية</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm text-gray-600">درجة الحرارة عند التسليم</span>
            <span class="font-mono font-bold text-green-600">-18.9°C</span>
          </div>
          <div class="flex items-center gap-1 mt-1">
            <i class="ti ti-circle-check text-green-500 text-xs"></i>
            <span class="text-xs text-green-600">لم تُسجَّل أي انتهاكات طوال الرحلة</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Confirm Button -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-4 shadow-xl">
      <button class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl text-sm transition-colors flex items-center justify-center gap-2">
        <i class="ti ti-circle-check text-lg"></i>
        تأكيد التسليم وإنهاء الرحلة
      </button>
    </div>
  </div>

  <script>
    document.querySelectorAll('[data-link]').forEach(el => {
      el.addEventListener('click', () => { window.location.href = el.dataset.link; });
    });
  </script>
</body>
</html>
